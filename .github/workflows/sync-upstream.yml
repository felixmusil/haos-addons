name: Sync upstream releases

on:
  schedule:
    - cron: "17 * * * *"   # hourly; adjust as desired
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync ${{ matrix.addon }} to ${{ matrix.upstream }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: qobuz-proxy
            upstream: qobuz-proxy
          - addon: tts-coordinator
            upstream: tts-server
    steps:
      - uses: actions/checkout@v4

      # An upstream with no published release yet (or a transient gh failure) is "nothing to do",
      # not a failure of the whole matrix.
      - name: Resolve versions
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDON: ${{ matrix.addon }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          set -uo pipefail
          latest=$(gh release view --repo "felixmusil/$UPSTREAM" --json tagName -q .tagName 2>/dev/null || true)
          latest=${latest#v}
          current=$(grep -m1 -E '^version:' "$ADDON/config.yaml" | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          changed=false
          if [ -z "$latest" ]; then
            echo "No published release found for felixmusil/$UPSTREAM — nothing to sync."
          else
            highest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
            if [ "$latest" != "$current" ] && [ "$highest" = "$latest" ]; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "release_tag=$ADDON-v$latest" >> "$GITHUB_OUTPUT"

      - name: Apply bump
        if: steps.v.outputs.changed == 'true'
        env:
          V: ${{ steps.v.outputs.latest }}
          ADDON: ${{ matrix.addon }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          set -euo pipefail
          # config.yaml version (1:1 with upstream)
          sed -i -E "s/^version:.*/version: \"$V\"/" "$ADDON/config.yaml"
          # pin the upstream image to the exact version (reproducible builds); upstream release
          # workflows tag the image `:v<version>`
          sed -i -E "s|^ARG BUILD_FROM=.*|ARG BUILD_FROM=ghcr.io/felixmusil/$UPSTREAM:v$V|" "$ADDON/Dockerfile"
          # prepend a changelog stub + table row (edit before merge)
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["V"]
          addon = os.environ["ADDON"]
          upstream = os.environ["UPSTREAM"]
          p = pathlib.Path(addon) / "CHANGELOG.md"
          t = p.read_text()
          # add a row right under the table header separator line
          t = re.sub(r"(\| -+ \| -+ \|\n)", rf"\1| {v:<14} | {v:<21} |\n", t, count=1)
          # insert a new section before the first existing "## " heading
          stub = (f"## {v}\n\n_Bundles `{upstream}` v{v}._\n\n"
                  f"- TODO: summarize upstream changes (auto-generated stub — edit before merging).\n\n")
          t = re.sub(r"(?m)^## ", stub + "## ", t, count=1)
          p.write_text(t)
          PY

      - name: Open PR
        if: steps.v.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/${{ matrix.addon }}-${{ steps.v.outputs.latest }}
          title: "chore(${{ matrix.addon }}): bump add-on to ${{ matrix.upstream }} v${{ steps.v.outputs.latest }}"
          commit-message: "chore(${{ matrix.addon }}): sync to ${{ matrix.upstream }} v${{ steps.v.outputs.latest }}"
          body: |
            Automated sync of **${{ matrix.addon }}** to upstream
            **${{ matrix.upstream }} v${{ steps.v.outputs.latest }}** (was ${{ steps.v.outputs.current }}).

            - `${{ matrix.addon }}/config.yaml` version → ${{ steps.v.outputs.latest }}
            - `${{ matrix.addon }}/Dockerfile` `BUILD_FROM` pinned to `${{ matrix.upstream }}:v${{ steps.v.outputs.latest }}`
            - `${{ matrix.addon }}/CHANGELOG.md` stub added — **edit the notes before merging**

            After merge, publish by creating tag/release `${{ steps.v.outputs.release_tag }}`
            (triggers `build.yml` for this add-on only).
          labels: automated, upstream-sync
